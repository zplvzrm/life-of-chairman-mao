body{width:100vw;height:100vh;overflow:hidden;background:#000;font-family:'Noto Serif SC',serif;cursor:crosshair;}

#bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;object-position:center bottom;z-index:0;}

#starCanvas{position:fixed;inset:0;width:100%;height:100%;z-index:2;}

.title-block p{font-size:clamp(9px,1.1vw,13px);color:rgba(200,180,140,.65);letter-spacing:.25em;margin-top:5px;}

/* ── Year search box ── */

  position:fixed;top:24px;right:56px;z-index:20;

}
#capsule{

  border:1px solid rgba(255,220,100,.35);

}
#capsule:focus-within{

#capsule label{

  white-space:nowrap;user-select:none;cursor:default;
}
#yearInput{

#yearInput::placeholder{color:rgba(255,210,100,.3);}
#search-msg{
  font-size:10px;color:rgba(255,120,100,.8);
  letter-spacing:.1em;display:none;padding-right:4px;
}

/* ── Tooltip ── */
#tooltip{position:fixed;z-index:20;pointer-events:none;opacity:0;transition:opacity .2s ease;transform:translate(-50%,-130%);}
#tooltip.show{opacity:1;}

// ── Nebula canvas (visible drifting clouds over photo) ──────────────
const nebula = document.getElementById('nebula');
const nCtx   = nebula.getContext('2d');

const NCLOUDS = 22;
const clouds  = [];

// Init canvas size first so we have real px dimensions
let NW = window.innerWidth;
let NH = window.innerHeight;
nebula.width  = NW;
nebula.height = NH;

for (let i = 0; i < NCLOUDS; i++) {
  clouds.push({
    cx:    Math.random() * NW,
    cy:    Math.random() * NH * 0.55,
    vx:    (Math.random() < 0.5 ? 1 : -1) * (8 + Math.random() * 14),
    vy:    (Math.random() < 0.5 ? 1 : -1) * (3 + Math.random() * 6),
    rf:    0.10 + Math.random() * 0.18,
    hue:   Math.random() < 0.5 ? 205 + Math.random()*30 : 260 + Math.random()*50,
    alpha: 0.18 + Math.random() * 0.18,
    phase: Math.random() * Math.PI * 2,
    spd:   0.10 + Math.random() * 0.22,
  });
}

function resizeNebula() {
  NW = nebula.width  = window.innerWidth;
  NH = nebula.height = window.innerHeight;
}
resizeNebula();

let lastT = 0;
function drawNebula(t) {
  const dt = lastT ? Math.min(t - lastT, 0.05) : 0.016;
  lastT = t;

  nCtx.clearRect(0, 0, NW, NH);

  // Clip to sky region only (top 62% of screen = above the mountains)
  const skyH = NH * 0.62;
  nCtx.save();
  nCtx.beginPath();
  nCtx.rect(0, 0, NW, skyH);
  nCtx.clip();

  for (const c of clouds) {
    // Move in pixel space with deltaTime
    c.cx += c.vx * dt;
    c.cy += c.vy * dt;

    const cr = c.rf * Math.min(NW, NH) * (1 + 0.06 * Math.sin(t * c.spd + c.phase));
    const margin = cr * 1.1;

    // Wrap horizontally
    if (c.cx < -margin)     c.cx = NW + margin;
    if (c.cx > NW + margin) c.cx = -margin;
    // Bounce vertically within sky — keep center + radius inside [0, skyH]
    if (c.cy - margin < 0)       { c.cy = margin;        c.vy = Math.abs(c.vy); }
    if (c.cy + margin > skyH)    { c.cy = skyH - margin; c.vy = -Math.abs(c.vy); }

    const al = c.alpha * (0.82 + 0.18 * Math.sin(t * c.spd * 0.55 + c.phase));

    const g = nCtx.createRadialGradient(c.cx, c.cy, 0, c.cx, c.cy, cr);
    g.addColorStop(0,    `hsla(${c.hue},70%,80%,${al.toFixed(3)})`);
    g.addColorStop(0.4,  `hsla(${c.hue},65%,60%,${(al*0.45).toFixed(3)})`);
    g.addColorStop(0.75, `hsla(${c.hue},55%,45%,${(al*0.12).toFixed(3)})`);
    g.addColorStop(1,    `hsla(${c.hue},50%,35%,0)`);

    nCtx.beginPath();
    nCtx.arc(c.cx, c.cy, cr, 0, Math.PI * 2);
    nCtx.fillStyle = g;
    nCtx.fill();
  }

  nCtx.restore();
}

// ── Star canvas ─────────────────────────────────────────────────────
const sc  = document.getElementById('starCanvas');
const ctx = sc.getContext('2d');
let W = 0, H = 0;

function resizeStar() {
  W = sc.width  = window.innerWidth;
  H = sc.height = window.innerHeight;
}
resizeStar();

window.addEventListener('resize', () => { resizeNebula(); resizeStar(); });

let hoveredIdx  = -1;
let selectedIdx = -1;
let pinnedIdx   = -1;

function hexA(hex, a) {
  let h = hex.replace('#','');
  if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  const r = parseInt(h.slice(0,2),16);
  const g = parseInt(h.slice(2,4),16);
  const b = parseInt(h.slice(4,6),16);
  return `rgba(${r},${g},${b},${Math.min(1,Math.max(0,a)).toFixed(3)})`;
}

// Radial glow
function drawGlow(x, y, r, color, alpha) {
  const g = ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,    hexA(color, alpha));
  g.addColorStop(0.35, hexA(color, alpha*0.4));
  g.addColorStop(1,    hexA(color, 0));
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fillStyle = g; ctx.fill();
}

// Five-pointed star path centred at (x,y)
function starPath(x, y, R) {
  const r = R * 0.42;
  ctx.beginPath();
  for (let k = 0; k < 10; k++) {
    const angle = (k * Math.PI / 5) - Math.PI / 2;
    const rad   = k % 2 === 0 ? R : r;
    k === 0
      ? ctx.moveTo(x + Math.cos(angle)*rad, y + Math.sin(angle)*rad)
      : ctx.lineTo(x + Math.cos(angle)*rad, y + Math.sin(angle)*rad);
  }
  ctx.closePath();
}

// Idle flicker state per star
const flickerActive = new Array(stars.length).fill(null);
const flickerNext   = stars.map(() => Math.random() * 8);

function drawOneStar(x, y, r, color, alpha, hov, sel, pin, t, flickerA) {
  // Glow layers
  if (pin) {
    const pulse = 1 + 0.3 * Math.sin(t * 2.4);
    drawGlow(x, y, r*8*pulse, color,   alpha*0.7*pulse);
    drawGlow(x, y, r*4,       '#fff',  alpha*0.4);
  } else if (sel) {
    drawGlow(x, y, r*7, color,  alpha*0.85);
    drawGlow(x, y, r*3, '#fff', alpha*0.5);
  } else if (hov) {
    drawGlow(x, y, r*6, color,  alpha*0.9);
    drawGlow(x, y, r*2.5,'#fff',alpha*0.55);
  } else if (flickerA > 0) {
    drawGlow(x, y, r*4, color, flickerA*0.45);
  }

  // Five-pointed star body
  ctx.save();
  starPath(x, y, r);
  if (hov || sel || pin) {
    ctx.fillStyle = hexA('#ffffff', alpha);      ctx.fill();
    ctx.fillStyle = hexA(color,     0.55);       ctx.fill();
  } else {
    const bodyA = flickerA > 0 ? alpha*(0.55+0.35*flickerA) : alpha*0.55;
    ctx.fillStyle = hexA('#ffffff', bodyA);      ctx.fill();
    ctx.fillStyle = hexA(color,     bodyA*0.6);  ctx.fill();
  }
  ctx.restore();
}

    tooltip.style.transform = 'translate(-50%, 0)';
    ttArrUp.style.display   = 'block';
    ttArrDown.style.display = 'none';
  } else {
    tooltip.style.top       = py + 'px';
    tooltip.style.transform = 'translate(-50%, -130%)';
    ttArrUp.style.display   = 'none';
    ttArrDown.style.display = 'block';

}

yearInput.addEventListener('input', () => {
  const val = parseInt(yearInput.value, 10);
  if (!val) { pinnedIdx = -1; searchMsg.style.display='none'; return; }
  if (val < 1893 || val > 1976) {
    pinnedIdx = -1;
    searchMsg.style.display = 'block';
    return;
  }
  searchMsg.style.display = 'none';
  const idx = stars.findIndex(s => s.year === val);
  if (idx >= 0) {
    pinnedIdx = idx;
    // Scroll tooltip to pinned star momentarily
    const s  = stars[idx];
    const px = s.x/100*W, py = s.y/100*H;
    ttYear.textContent      = s.year;
    ttYear.style.color      = s.color;
    ttYear.style.textShadow = `0 0 12px ${s.color}`;
    ttAge.textContent       = (s.year - 1893) + ' 岁';
    positionTooltip(px, py);
    tooltip.classList.add('show');
    setTimeout(() => { if (hoveredIdx < 0) tooltip.classList.remove('show'); }, 1800);
  }
});

yearInput.addEventListener('keydown', e => e.stopPropagation());

// ── Animation loop ───────────────────────────────────────────────────
function animate() {
  const t = performance.now() / 1000;
  drawNebula(t);
  ctx.clearRect(0, 0, W, H);

  for (let i = 0; i < stars.length; i++) {
    const s   = stars[i];
    const px  = s.x / 100 * W;
    const py  = s.y / 100 * H;
    const hov = i === hoveredIdx;
    const sel = i === selectedIdx;
    const pin = i === pinnedIdx;

    // Base size — no constant twinkle on size, keep stars crisp at rest
    const r = s.size * (hov ? 1.7 : pin ? 1.9 : sel ? 1.5 : 1);

    // Idle flicker: random stars briefly glow
    let flickerA = 0;
    if (!hov && !sel && !pin) {
      if (flickerNext[i] <= t) {
        // Start a new flicker event
        flickerActive[i] = { start: t, dur: 0.6 + Math.random() * 1.0 };
        flickerNext[i]   = t + 6 + Math.random() * 18; // next in 6–24s
      }
      if (flickerActive[i]) {
        const elapsed = t - flickerActive[i].start;
        const prog    = elapsed / flickerActive[i].dur;
        if (prog >= 1) {
          flickerActive[i] = null;
        } else {
          // Smooth bell curve: sin²(π·prog)
          flickerA = Math.sin(Math.PI * prog) ** 2;
        }
      }
    }

    drawOneStar(px, py, r, s.color, s.opacity, hov, sel, pin, t, flickerA);
  }
  requestAnimationFrame(animate);
}
animate();

// ── Mouse ────────────────────────────────────────────────────────────
sc.addEventListener('mousemove', (e) => {
  const mx = e.clientX, my = e.clientY;
  let best = -1, bestD = Infinity;
  for (let i = 0; i < stars.length; i++) {
    const s  = stars[i];
    const px = s.x/100*W, py = s.y/100*H;
    const d  = Math.hypot(mx-px, my-py);
    if (d < s.size*2.5+14 && d < bestD) { bestD=d; best=i; }
  }
  if (best >= 0) {
    hoveredIdx = best;
    sc.style.cursor = 'pointer';
    const s  = stars[best];
    const px = s.x/100*W, py = s.y/100*H;
    ttYear.textContent      = s.year;
    ttYear.style.color      = s.color;
    ttYear.style.textShadow = `0 0 12px ${s.color}`;
    ttAge.textContent       = (s.year - 1893) + ' 岁';
    positionTooltip(px, py);
    tooltip.classList.add('show');
  } else {
    hoveredIdx = -1;
    sc.style.cursor = 'crosshair';
    tooltip.classList.remove('show');
  }
});

sc.addEventListener('click', () => {
  if (hoveredIdx >= 0) {
    // 再次点击已选中的星星 → 取消选中，不跳转
    if (selectedIdx === hoveredIdx) {
      selectedIdx = -1;
      return;
    }
    const s  = stars[hoveredIdx];
    const px = s.x/100*W, py = s.y/100*H;
    const rpl = document.createElement('div');
    rpl.className = 'ripple';
    rpl.style.cssText = `left:${px}px;top:${py}px;border-color:${s.color};`;
    document.body.appendChild(rpl);
    setTimeout(() => rpl.remove(), 900);
    selectedIdx = hoveredIdx;
    setTimeout(() => { runTunnel(() => { window.location.href = `detail.html?year=${s.year}`; }); }, 1000);
  }
});

sc.addEventListener('mouseleave', () => {
  hoveredIdx = -1;
  tooltip.classList.remove('show');
});



const API_BASE = 'http://127.0.0.1:8000/api';

// === TUNNEL ===
function runTunnel(onDone) {
  const overlay = document.getElementById('tunnel-overlay');
  const tc = document.getElementById('tunnel-canvas');
  const tctx = tc.getContext('2d');
  overlay.style.display = 'block';
  tc.width = window.innerWidth; tc.height = window.innerHeight;
  const CX = tc.width/2, CY = tc.height/2;
  const DURATION = 1100;
  const start = performance.now();
  const rings = Array.from({length:28}, (_,i) => ({
    baseR: 16+i*20, angle: Math.random()*Math.PI*2,
    spd: 0.035+i*0.003, hue: 190+i*7
  }));
  function frame(now) {
    const p = Math.min((now-start)/DURATION, 1);
    tctx.clearRect(0,0,tc.width,tc.height);
    const vr = (1-p)*Math.max(tc.width,tc.height)*0.8+1;
    const vig = tctx.createRadialGradient(CX,CY,0,CX,CY,vr);
    vig.addColorStop(0,`rgba(0,0,0,0)`);
    vig.addColorStop(0.5,`rgba(0,0,0,${(p*0.35).toFixed(3)})`);
    vig.addColorStop(1,`rgba(0,0,0,${(0.45+p*0.55).toFixed(3)})`);
    tctx.fillStyle=vig; tctx.fillRect(0,0,tc.width,tc.height);
    for(const ring of rings) {
      ring.angle += ring.spd*0.35;
      const zoom = 1+p*9;
      const r = ring.baseR*zoom;
      const al = Math.max(0, 0.75-p*0.5)*(1-r/(tc.width*0.95));
      if(al<=0||r>tc.width) continue;
      tctx.save();
      tctx.strokeStyle=`hsla(${ring.hue},80%,72%,${al.toFixed(3)})`;
      tctx.lineWidth=1.3;
      tctx.shadowColor=`hsla(${ring.hue},80%,70%,0.4)`;
      tctx.shadowBlur=10;
      tctx.beginPath();
      tctx.ellipse(CX,CY,r,r*0.52,ring.angle,0,Math.PI*2);
      tctx.stroke(); tctx.restore();
    }
    if(p>0.68){
      const fa=(p-0.68)/0.32;
      const fl=tctx.createRadialGradient(CX,CY,0,CX,CY,180+fa*500);
      fl.addColorStop(0,`rgba(255,240,190,${(fa*0.95).toFixed(3)})`);
      fl.addColorStop(0.35,`rgba(220,185,80,${(fa*0.5).toFixed(3)})`);
      fl.addColorStop(1,`rgba(0,0,0,0)`);
      tctx.fillStyle=fl; tctx.fillRect(0,0,tc.width,tc.height);
    }
    if(p<1) { requestAnimationFrame(frame); }
    else { setTimeout(()=>{ overlay.style.display='none'; tctx.clearRect(0,0,tc.width,tc.height); if(onDone) onDone(); },80); }
  }
  requestAnimationFrame(frame);
}
</script>
