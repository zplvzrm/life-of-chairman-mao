[tool.poetry]
name = "life_of_chairman_mao"
version = "0.1.0"
description = "毛主席的一生。"
readme = "README.md"
authors = ["zp <2579349206@qq.com>"]
license = "MIT"
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
]

[tool.poetry.dependencies]
python = "^3.11"
dynaconf = "^3.1.12"
click = "^8.1.3"
rich = "^15.0.0"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.34.0"}
aiomysql = "^0.2.0"
pydantic = "^2.0.0"
cryptography = "^46.0.7"
xparse-client = "^0.3.0"

[tool.poetry.group.dev.dependencies]
pylint = "^2.17.4"
isort = "^5.12.0"
pytest = "^7.3.1"
tox = "^4.5.2"
mkdocs = "^1.4.3"
mkdocs-material = "^8.5.11"
pytest-pylint = "^0.19.0"
pre-commit = "^3.3.2"

[tool.poetry.scripts]
life_of_chairman_mao = "life_of_chairman_mao.cmdline:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
[tool.pytest.ini_options]
testpaths = "tests"
python_files = "tests.py test_*.py *_tests.py"

[tool.pylint.design]
max-line-length = 120
